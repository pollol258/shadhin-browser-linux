[package]
name = "shadhin-browser"
version = "0.1.0"
edition = "2024"
authors = ["Shadhin Browser Contributors"]
description = "Fast · Private · Open — Native Linux web browser built with GTK4, Libadwaita, and WebKitGTK 6"
readme = "README.md"
license = "GPL-3.0-or-later"
repository = "https://github.com/placeholder-user/shadhin-browser"
homepage = "https://github.com/placeholder-user/shadhin-browser"

[dependencies]
gtk4 = { version = "0.11.5", features = ["v4_10"] }
adw = { package = "libadwaita", version = "0.9.2", features = ["v1_6"] }
webkit6 = { version = "0.6.1", features = ["v2_42"] }
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2.0"
anyhow = "1.0"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
opt-level = 0
debug = true
