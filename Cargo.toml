[package]
name = "shadhin-browser"
version = "0.1.0"
edition = "2024"
authors = ["Shadhin Browser Contributors"]
description = "Fast · Private · Open — Native Linux web browser built with GTK4, Libadwaita, and WebKitGTK 6"
readme = "README.md"
license = "GPL-3.0-or-later"
repository = "https://github.com/placeholder-user/shadhin-browser"
homepage = "https://github.com/placeholder-user/shadhin-browser"

[dependencies]
gtk4 = { version = "0.11.5", features = ["v4_10"] }
adw = { package = "libadwaita", version = "0.9.2", features = ["v1_6"] }
webkit6 = { version = "0.6.1", features = ["v2_42"] }
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2.0"
anyhow = "1.0"

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.profiling]
inherits = "release"
debug = true
strip = false

[profile.dev]
opt-level = 0
debug = true

[package.metadata.deb]
maintainer = "Ziaur Rahman <ziaur@example.com>"
depends = "$auto, libwebkitgtk-6.0-4, libgtk-4-1, libadwaita-1-0"
section = "web"
priority = "optional"
assets = [
    ["target/release/shadhin-browser", "usr/bin/", "755"],
    ["data/com.shadhin.browser.desktop", "usr/share/applications/", "644"],
    ["data/icons/hicolor/scalable/apps/com.shadhin.browser.svg", "usr/share/icons/hicolor/scalable/apps/", "644"],
]

[package.metadata.generate-rpm]
assets = [
    { source = "target/release/shadhin-browser", dest = "/usr/bin/shadhin-browser", mode = "0755" },
    { source = "data/com.shadhin.browser.desktop", dest = "/usr/share/applications/com.shadhin.browser.desktop", mode = "0644" },
    { source = "data/icons/hicolor/scalable/apps/com.shadhin.browser.svg", dest = "/usr/share/icons/hicolor/scalable/apps/com.shadhin.browser.svg", mode = "0644" },
]

[package.metadata.generate-rpm.requires]
"libwebkitgtk-6.0-4" = "*"
"libgtk-4-1" = "*"
"libadwaita-1-0" = "*"
